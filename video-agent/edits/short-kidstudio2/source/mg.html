function place(d, x, y) { d.style.left = (x - d.offsetWidth / 2) + 'px'; d.style.top = y + 'px'; }

[[0.6, 540, 220], [2.85, 540, 300], [80.3, 540, 380], [9.4, 540, 450], [15.8, 540, 280], [25.8, 540, 300], [32.4, 540, 300], [39.0, 540, 250], [45.2, 540, 420], [53.1, 540, 400], [62.1, 540, 450], [64.9, 540, 120], [69.7, 540, 520], [78.1, 540, 230], [81.1, 540, 460]].forEach(b => BURSTS.push(b));
function drawFx(t) { fx.clearRect(0, 0, 1080, 1920);
  for (const [t0, x, y] of BURSTS) { const u = t - t0; if (u < 0 || u > 1.2) continue;

function draw(t) {
  E.forEach(([type, at, until, x, y, p], i) => {
    const d = EL[i];
    if (t < at || t >= until) { d.style.opacity = 0; return; }
    place(d, x, y);
    const pb = B(t - at), q = S(t - at, 14), out = cl((until - t) / .15);
    let s = (.25 + .75 * pb) * (.6 + .4 * out), r = Math.sin(t * 2.2 + i) * 2, ty = Math.sin(t * 1.8 + i) * 6 - 30 * (1 - out), tx = 0;
    if (p.spin) r += (1 - q) * -200;
    if (type === 'stamp') { s = t - at < .18 ? 3 - 2 * ((t - at) / .18) : 1; r = 0; }
    if (p.arrow) ty += Math.abs(Math.sin(t * 5)) * 26;
    if (p.fly) { tx = (1 - q) * -500; ty += (1 - q) * 200; r = -20; }
    if (p.cur) { const k = S(t - at, 7); tx = 1000 + (720 - 1000) * k; ty = 1900 + (470 - 1900) * k; d.style.left = '0px'; d.style.top = '0px'; s = t > 81.07 && t < 81.25 ? .85 : 1; r = 0; }
    if (p.cta) s *= 1 + .04 * Math.sin(t * 6) - (t > 81.07 && t < 81.3 ? .06 : 0);
    d.style.opacity = cl(q * 2) * out;
    d.style.transform = `translate(${tx}px,${ty}px) scale(${s}) rotate(${r}deg)`;
    if (p.x) { const xm = d.querySelector('.xmark'); xm.style.transform = `rotate(-8deg) scaleX(${S(t - p.xat, 12)})`; d.style.filter = t > p.xat ? 'grayscale(.4)' : ''; }

  });
